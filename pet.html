<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小手机桌宠</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: transparent;
            overflow: hidden;
            width: 240px;
            height: 420px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .pet-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        .pet-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }
        /* 对话气泡 */
        .bubble {
            position: absolute;
            top: -70px;
            left: 10px;
            background: #fff;
            padding: 10px 14px;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            max-width: 210px;
            display: none;
            z-index: 100;
            font-size: 13px;
            line-height: 1.4;
            color: #333;
        }
        /* 交互热区 */
        .hot-area {
            position: absolute;
            cursor: pointer;
        }
        #hotHead {
            top: 0;
            left: 30px;
            width: 110px;
            height: 110px;
        }
        #hotFace {
            top: 100px;
            left: 40px;
            width: 90px;
            height: 90px;
        }
        /* 设置按钮 */
        #openSetBtn {
            position: absolute;
            right: 0;
            top: 0;
            width: 24px;
            height: 24px;
            background: rgba(255,255,255,0.9);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 12px;
            z-index: 200;
        }
        /* 设置面板 */
        .setting-panel {
            position: absolute;
            left: 250px;
            top: 0;
            width: 260px;
            background: rgba(255,255,255,0.98);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.2);
            display: none;
            font-size: 13px;
            z-index: 300;
        }
        .setting-panel > div {
            margin: 10px 0;
        }
        .setting-panel label {
            display: block;
            margin-bottom: 4px;
            font-weight: 500;
        }
        .setting-panel select,
        .setting-panel input,
        .setting-panel textarea {
            width: 100%;
            padding: 6px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
        }
        .setting-panel textarea {
            height: 80px;
            resize: none;
        }
        .setting-panel button {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            background: #4A90E2;
            color: white;
            cursor: pointer;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="pet-container">
        <div class="bubble" id="bubble"></div>
        <img class="pet-img" id="petImg" src="assets/default.png" alt="桌宠">
        <div class="hot-area" id="hotHead"></div>
        <div class="hot-area" id="hotFace"></div>
        <button id="openSetBtn">⚙</button>

        <div class="setting-panel" id="settingPanel">
            <div>
                <label>AI模型选择</label>
                <select id="selModel">
                    <option value="mimo">小米MiMo-Vision</option>
                    <option value="minimax">MiniMax Vision</option>
                    <option value="deepseek">DeepSeek-VL</option>
                    <option value="gpt4v">GPT-4o-mini</option>
                </select>
            </div>
            <div>
                <label>截图间隔(秒，最低15秒)</label>
                <input type="number" id="inpInterval" min="15" max="180" value="25">
            </div>
            <div>
                <label>互动风格提示词</label>
                <textarea id="txtStyle">以傲娇痞帅的恋爱角色语气，简短吐槽当前手机屏幕内容，25字以内，带点吃醋感。</textarea>
            </div>
            <div>
                <button id="btnSave">保存设置</button>
                <button id="btnClose" style="background:#999">关闭</button>
            </div>
        </div>
    </div>

    <script>
        const bubble = document.getElementById('bubble');
        const petImg = document.getElementById('petImg');
        const hotHead = document.getElementById('hotHead');
        const hotFace = document.getElementById('hotFace');
        const openSetBtn = document.getElementById('openSetBtn');
        const settingPanel = document.getElementById('settingPanel');
        const selModel = document.getElementById('selModel');
        const inpInterval = document.getElementById('inpInterval');
        const txtStyle = document.getElementById('txtStyle');
        const btnSave = document.getElementById('btnSave');
        const btnClose = document.getElementById('btnClose');

        // 默认配置
        const defaultConfig = {
            aiModel: 'mimo',
            intervalSec: 25,
            stylePrompt: '以傲娇痞帅的恋爱角色语气，简短吐槽当前手机屏幕内容，25字以内，带点吃醋感。'
        };

        // 加载本地配置
        function loadConfig() {
            const saved = localStorage.getItem('petSettings');
            const config = saved ? JSON.parse(saved) : defaultConfig;
            selModel.value = config.aiModel;
            inpInterval.value = config.intervalSec;
            txtStyle.value = config.stylePrompt;
        }
        loadConfig();

        // 保存配置
        btnSave.onclick = () => {
            const newConfig = {
                aiModel: selModel.value,
                intervalSec: Math.max(15, Number(inpInterval.value)),
                stylePrompt: txtStyle.value
            };
            localStorage.setItem('petSettings', JSON.stringify(newConfig));
            alert('设置已保存！');
            settingPanel.style.display = 'none';
        };
        openSetBtn.onclick = () => settingPanel.style.display = 'block';
        btnClose.onclick = () => settingPanel.style.display = 'none';

        // 供安卓无障碍服务调用：读取用户配置
        window.getUserPetSettings = function() {
            return localStorage.getItem('petSettings') || JSON.stringify(defaultConfig);
        };

        // 供安卓无障碍服务调用：弹出AI点评气泡
        window.receiveAiScreenComment = function(text) {
            showBubble(text);
        };

        // 显示气泡
        function showBubble(text) {
            bubble.textContent = text;
            bubble.style.display = 'block';
            clearTimeout(bubble.timer);
            bubble.timer = setTimeout(() => {
                bubble.style.display = 'none';
            }, 4000);
        }

        // 摸头交互
        hotHead.onclick = () => {
            showBubble('别乱摸我头啦...');
        };
        // 戳脸交互
        hotFace.onclick = () => {
            showBubble('喂！戳脸很疼的！');
        };
        // 点击角色跳转小手机主页面
        petImg.parentElement.addEventListener('click', (e) => {
            if (!e.target.classList.contains('hot-area') && e.target.id !== 'openSetBtn' && !settingPanel.contains(e.target)) {
                window.open('https://doremy.netlify.app/', '_blank');
            }
        });

        // 同步小手机状态切换表情
        setInterval(() => {
            const mood = localStorage.getItem('petMood');
            if (mood === 'happy') petImg.src = 'assets/happy.png';
            else if (mood === 'shy') petImg.src = 'assets/shy.png';
            else if (mood === 'annoyed') petImg.src = 'assets/annoyed.png';
        }, 1000);
    </script>
</body>
</html>
